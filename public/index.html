<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة نشر ذا كابيتال سويتس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a production board. Summary strip for management on top, then the week-by-week publishing table; a side sheet holds each post's brief, files and the thread with the designer. */
:root{
  --bg:#F5F2EA; --surface:#FFFDF8; --sunk:#EDE8DC; --ink:#1F2427; --muted:#646A6E; --line:#E0D8C6;
  --gold:#C29B3C; --gold-ink:#8C6A1E; --gold-soft:#F3E8C9; --charcoal:#1F2427; --on-charcoal:#F7F4EC;
  --st-idea:#8A8F93; --st-copy:#3F6FA8; --st-design:#7A5BA6; --st-review:#B7791F; --st-changes:#B4483A; --st-approved:#3D8B5A; --st-scheduled:#2C8288; --st-published:#24603C;
  --warn:#B4483A;
  --f-display:'Alexandria','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
  --shadow:0 18px 50px rgba(31,36,39,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141719; --surface:#1D2124; --sunk:#252A2E; --ink:#EFEBE1; --muted:#A2A7AA; --line:#33393D;
  --gold:#E2C466; --gold-ink:#E2C466; --gold-soft:#3A3322; --charcoal:#0F1112; --on-charcoal:#F7F4EC;
  --st-idea:#9AA0A4; --st-copy:#7FA6D6; --st-design:#A98BD3; --st-review:#E0A64A; --st-changes:#E07A6C; --st-approved:#6FC08C; --st-scheduled:#5DBDC2; --st-published:#8FD3A6;
  --warn:#E07A6C; --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141719; --surface:#1D2124; --sunk:#252A2E; --ink:#EFEBE1; --muted:#A2A7AA; --line:#33393D;
  --gold:#E2C466; --gold-ink:#E2C466; --gold-soft:#3A3322; --charcoal:#0F1112; --on-charcoal:#F7F4EC;
  --st-idea:#9AA0A4; --st-copy:#7FA6D6; --st-design:#A98BD3; --st-review:#E0A64A; --st-changes:#E07A6C; --st-approved:#6FC08C; --st-scheduled:#5DBDC2; --st-published:#8FD3A6;
  --warn:#E07A6C; --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark}
[hidden]{display:none!important}
html,body{direction:rtl}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:0 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{background:var(--charcoal);color:var(--on-charcoal);padding-block:22px 18px;margin-bottom:22px}
.top .wrap{padding-block:0;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.brand small{display:block;font-size:12px;letter-spacing:.06em;color:#E2C466;font-family:var(--f-display);font-weight:600}
.brand h1{font-size:clamp(22px,3vw,30px);font-weight:800;color:#fff}
.who{display:flex;gap:10px;align-items:center;font-size:13px;color:rgba(247,244,236,.75)}
.who img{width:28px;height:28px;border-radius:50%}
.role{border:1px solid rgba(226,196,102,.5);color:#E2C466;border-radius:20px;padding:1px 10px;font-size:12px}
.tabs{display:flex;gap:4px;margin-top:16px}
.tabs button{background:transparent;border:0;color:rgba(247,244,236,.7);padding:8px 14px;border-radius:8px 8px 0 0;font-family:var(--f-display);font-weight:600;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.top .tabs-row{width:100%;margin-bottom:-18px}

/* Summary */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.stat.alert b{color:var(--warn)}
.pipe{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk);margin:8px 0 10px}
.pipe i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 8px;margin-bottom:18px}
.panel h2{font-size:17px;font-weight:700;margin-bottom:4px}
.panel .sub{font-size:13px;color:var(--muted);margin:0 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.mini{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-bottom:0;width:100%;text-align:start}
.mini:hover .mt{color:var(--gold-ink)}
.mini .md{width:58px;flex-shrink:0;font-size:12.5px;color:var(--muted);line-height:1.35}
.mini .md b{display:block;color:var(--ink);font-size:14px;font-family:var(--f-display)}
.mini .mt{flex:1;min-width:0;font-size:14px;font-weight:500}
.empty-note{color:var(--muted);font-size:14px;padding:10px 0 14px}

/* Toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar select,.bar input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;min-width:0}
.bar input{flex:1 1 180px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--charcoal);color:var(--on-charcoal);border-color:var(--charcoal)}
.count{font-size:13px;color:var(--muted);margin-inline-start:auto}

/* Table */
.week{margin-bottom:22px}
.week-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:0 4px 8px;border-bottom:2px solid var(--gold)}
.week-h h3{font-size:16px;font-weight:700}
.week-h span{font-size:13px;color:var(--muted)}
.row,.thead{display:grid;grid-template-columns:92px 74px 62px minmax(0,1fr) 128px 92px 92px;gap:12px;align-items:center;padding:11px 8px}
.thead{font-size:12px;color:var(--muted);letter-spacing:.03em;padding-block:8px;font-weight:600}
.row{border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer;width:100%;text-align:start;border-inline:0;border-top:0}
.row:hover{background:var(--sunk)}
.row.past{opacity:.72}
.c-date b{display:block;font-family:var(--f-display);font-size:15px;font-weight:600}
.c-date span{font-size:12px;color:var(--muted)}
.pl{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--bg)}
.pl small{font-weight:400;color:var(--muted)}
.lv{display:inline-block;font-family:var(--f-display);font-size:12px;font-weight:700;border-radius:5px;padding:2px 7px;background:var(--gold-soft);color:var(--gold-ink)}
.lv.P{background:var(--charcoal);color:#E2C466}
.c-main{min-width:0}
.c-main .ser{font-size:12px;color:var(--gold-ink);font-weight:600}
.c-main .ttl{font-weight:600;font-size:14.5px;line-height:1.45;display:block}
.c-main .fmt{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.flag{font-size:11.5px;border-radius:4px;padding:0 6px;background:var(--sunk);color:var(--muted)}
.flag.warn{color:var(--warn);background:transparent;border:1px solid var(--warn)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--sc);background:color-mix(in srgb,var(--sc) 12%,transparent);border-radius:20px;padding:2px 10px 2px 10px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}
.c-due{font-size:13px}
.c-due.late{color:var(--warn);font-weight:600}
.c-files{display:flex;gap:4px;align-items:center}
.c-files img{width:30px;height:30px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.c-files .more{font-size:12px;color:var(--muted)}
.c-files .notes{font-size:12px;color:var(--muted);margin-inline-start:4px;white-space:nowrap}
@media (max-width:860px){
  .thead{display:none}
  .row{grid-template-columns:auto 1fr auto;grid-template-areas:"date main st" "plv main files" "due due due";align-items:start;gap:6px 12px}
  .c-date{grid-area:date}.c-plv{grid-area:plv}.c-main{grid-area:main}.c-st{grid-area:st}.c-due{grid-area:due}.c-files{grid-area:files}
  .c-pl{display:none}
}
.c-plv{display:none}
@media (max-width:860px){.c-plv{display:flex;gap:4px;flex-wrap:wrap}.c-lv{display:none}}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(15,17,18,.45);z-index:20}
.sheet{position:fixed;top:0;bottom:0;left:0;width:min(620px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-head{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.sh-head h2{font-size:19px;font-weight:700;line-height:1.4}
.sh-head .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px;font-size:13px;color:var(--muted)}
.x{background:var(--sunk);border:0;border-radius:8px;width:34px;height:34px;font-size:18px;flex-shrink:0;margin-inline-start:auto}
.sh-body{overflow-y:auto;padding:18px 22px 30px;display:flex;flex-direction:column;gap:20px}
.blk h4{font-family:var(--f-display);font-size:13px;font-weight:600;color:var(--gold-ink);margin:0 0 6px;letter-spacing:.02em}
.blk p{margin:0}
.cap{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14.5px;line-height:1.75;max-height:340px;overflow:auto}
.cap mark{background:var(--gold-soft);color:var(--gold-ink);border-radius:3px;padding:0 2px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13.5px;font-weight:500}
.btn.pri{background:var(--charcoal);color:var(--on-charcoal);border-color:var(--charcoal)}
.btn:disabled{opacity:.5;cursor:default}
.stepper{display:flex;flex-wrap:wrap;gap:6px}
.stepper button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:5px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.stepper button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sc)}
.stepper button[aria-pressed="true"]{background:color-mix(in srgb,var(--sc) 16%,var(--surface));border-color:var(--sc);font-weight:600}
.stepper button:disabled{cursor:default}
.field{display:flex;gap:8px}
.field input,.field textarea,textarea.full{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
textarea.full{width:100%;min-height:200px;line-height:1.7}
.link-out{font-size:13.5px;color:var(--gold-ink);word-break:break-all}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.imgs a{display:block;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.imgs img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.imgs figure.up{margin:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sunk)}
.imgs figure.up a{border:0;border-radius:0}
.imgs video{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#000}
.imgs .pdf{display:flex;align-items:center;justify-content:center;aspect-ratio:4/5;font-weight:700;color:var(--ink-2)}
.imgs figcaption{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:4px 6px;font-size:11.5px;color:var(--ink-3)}
.imgs .rm{border:0;background:none;color:var(--st-changes);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.up-btn{cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.thread{display:flex;flex-direction:column;gap:10px}
.note{display:flex;gap:10px}
.note img{width:28px;height:28px;border-radius:50%;flex-shrink:0}
.note .nb{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex:1;min-width:0}
.note .nh{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.note .nh b{color:var(--ink);font-weight:600}
.note .nt{white-space:pre-wrap;font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.note.sys .nb{background:transparent;border-style:dashed}
.updated{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.fl{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--gold-ink);font-family:var(--f-display)}
.fl input,.fl select,.fl textarea{font-family:var(--f-body);font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;width:100%;min-width:0}
.fl textarea.sm{min-height:0}
.fl small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px}
.err{color:var(--warn);font-size:14px;margin:0}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.confirm{border:1px solid var(--warn);border-radius:10px;padding:12px 14px}
.confirm p{margin:0 0 6px}
.srow{grid-template-columns:92px 74px minmax(0,1fr) 128px 92px}
.late-t{color:var(--warn)}
.set-intro{margin:0;font-size:14px;color:var(--muted);flex:1 1 320px}
@media (max-width:860px){.srow{grid-template-columns:auto 1fr auto;grid-template-areas:"date main st" "pl main files"}.srow .c-pl{display:block;grid-area:pl}}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--charcoal);color:var(--on-charcoal);padding:9px 18px;border-radius:8px;font-size:14px;z-index:30}
.state{padding:40px 10px;text-align:center;color:var(--muted)}
.state h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.guide{font-size:13.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px 16px;margin-bottom:18px}
.guide b{color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(-30px);opacity:.6}}}
</style>

<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="runtime.js"></script>
<script>document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','ar');</script>
<header class="top" dir="rtl">
  <div class="wrap">
    <div class="brand"><small>THE CAPITAL SUITES · تقويم المحتوى</small><h1>لوحة النشر</h1></div>
    <div class="who" id="who"></div>
    <div class="tabs-row"><div class="tabs" role="tablist">
      <button role="tab" id="tab-sum" aria-selected="true" data-v="sum">ملخص الإدارة</button>
      <button role="tab" id="tab-set" aria-selected="false" data-v="set">التأسيس</button>
      <button role="tab" id="tab-tbl" aria-selected="false" data-v="tbl">جدول النشر</button>
    </div></div>
  </div>
</header>

<main class="wrap" dir="rtl">
  <div id="loading" class="state"><h3>جارِ تحميل التقويم</h3><p>المنشورات بتظهر هنا خلال ثوانٍ.</p></div>

  <section id="v-sum" hidden></section>

  <section id="v-set" hidden>
    <div class="bar"><p class="set-intro">كل اللي لازم يجهز قبل أول منشور: البايو، الهايلايتس، الصور، الصفحات، والقوالب. آخر موعد لكل عنصر قبل الانطلاق في 15 أكتوبر.</p><span class="count num" id="set-count"></span><button class="btn pri" id="new-setup" hidden>+ عنصر تأسيسي</button></div>
    <div id="set"></div>
  </section>

  <section id="v-tbl" hidden>
    <div class="bar">
      <select id="f-week" aria-label="الأسبوع"></select>
      <select id="f-pl" aria-label="المنصة"><option value="">كل المنصات</option><option value="IG">Instagram</option><option value="FB">Facebook</option><option value="TT">TikTok</option><option value="X">X</option></select>
      <select id="f-st" aria-label="الحالة"></select>
      <button class="chip" id="f-design" aria-pressed="false">مطلوب من المصمم</button>
      <button class="chip" id="f-review" aria-pressed="false">بانتظار الاعتماد</button>
      <input id="f-q" type="search" placeholder="ابحث في العناوين والنصوص">
      <span class="count num" id="count"></span>
      <button class="btn pri" id="new-post" hidden>+ منشور جديد</button>
    </div>
    <div id="tbl"></div>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" dir="rtl" hidden role="dialog" aria-modal="true" aria-labelledby="sh-title"></aside>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
var ST=[
 {k:'idea',l:'فكرة / بريف'},{k:'copy',l:'النص جاهز'},{k:'design',l:'عند المصمم'},{k:'review',l:'للمراجعة'},
 {k:'changes',l:'تعديلات مطلوبة'},{k:'approved',l:'معتمد'},{k:'scheduled',l:'مجدول'},{k:'published',l:'منشور'}];
var STL={};ST.forEach(function(s){STL[s.k]=s.l});
var DONE={approved:1,scheduled:1,published:1};
var LV={A:'الثقة',B:'المعرفة',C:'التجاري',P:'إثبات الأداء'};
var PL={IG:'Instagram',FB:'Facebook',TT:'TikTok',X:'X',LI:'LinkedIn (متوقف)',ALL:'كل المنصات',WA:'واتساب'};
var PAUSED={LI:1},PAUSED_N=0; // لينكدإن متوقف مؤقتاً بسبب مشكلة في الحساب
function targets(p){return (p.targets||({IG:['IG'],FB:['FB'],TT:['TT'],X:['X'],ALL:['IG','FB','TT','X']}[p.p]||[])).filter(function(k){return !PAUSED[k]})}
var PSHORT={IG:'IG',FB:'FB',TT:'TT',X:'X',LI:'LI',ALL:'عام',WA:'واتساب'};
var TIME={IG:'9:00 م',FB:'9:00 م',TT:'9:00 م',X:'8:00 م'};
var DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var PHASES=[{n:'التأسيس',a:'2026-10-15',b:'2026-11-14'},{n:'المعرفة',a:'2026-11-15',b:'2026-12-14'},{n:'التحويل',a:'2026-12-15',b:'2027-01-14'}];
var PO={ALL:0,IG:1,FB:2,TT:3,X:4,WA:5,LI:6};
var DESIGN_LEAD=3; // أيام قبل النشر لتسليم التصميم
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
var START=pd('2026-10-15');
var TODAY=pd(iso(new Date()));
function weekOf(s){return Math.floor((pd(s)-START)/864e5/7)+1}
function weekRange(w){var a=addD(START,(w-1)*7),b=addD(a,6);return a.getDate()+' '+MON[a.getMonth()]+' – '+b.getDate()+' '+MON[b.getMonth()]}
function fmtD(s){var d=pd(s);return d.getDate()+' '+MON[d.getMonth()]}
function isFri(s){return pd(s).getDay()===5}
function nextWork(d){while(d.getDay()===5)d=addD(d,1);return d}
function workday(d){while(d.getDay()===5)d=addD(d,-1);return d}
function due(s){return iso(workday(addD(pd(s),-DESIGN_LEAD)))}
function dueOf(p){return p.dd||due(p.d)}
function tmOf(p){return p.tm||TIME[p.p]||''}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function hasPH(p){return /\[[^\]]+\]/.test(p.c||'')}
function isSetup(p){return p.kind==='setup'}
function isLate(p){if(isSetup(p))return !DONE[p.status]&&p.d<iso(TODAY);return !DONE[p.status] && p.status!=='review' && dueOf(p)<iso(TODAY)}
function pubLate(p){return !isSetup(p)&&p.status!=='published' && p.d<iso(TODAY)}
function stTag(k){return '<span class="st" style="--sc:var(--st-'+k+')">'+esc(STL[k]||k)+'</span>'}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:''}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

var EDITING=false,SETUP=[],POSTS=[],BY={},db=null,user=null,ME={id:null,name:'',canWrite:null,isOwner:false,avatar:''},VIEW=store('cc-view')||'sum',OPEN=null,unNotes=null,NOTES=[],readOnly=false;

/* ---------- tabs ---------- */
var tabs=document.querySelectorAll('.tabs button');
function setView(v){VIEW=v;store('cc-view',v);tabs.forEach(function(b){b.setAttribute('aria-selected',b.dataset.v===v?'true':'false')});render()}
tabs.forEach(function(b){b.onclick=function(){setView(b.dataset.v)}});

/* ---------- filters ---------- */
var fWeek=document.getElementById('f-week'),fPl=document.getElementById('f-pl'),fSt=document.getElementById('f-st'),fQ=document.getElementById('f-q'),fDesign=document.getElementById('f-design'),fReview=document.getElementById('f-review');
fSt.innerHTML='<option value="">كل الحالات</option>'+ST.map(function(s){return '<option value="'+s.k+'">'+s.l+'</option>'}).join('');
[fWeek,fPl,fSt].forEach(function(el){el.onchange=renderTable});
fQ.oninput=renderTable;
[fDesign,fReview].forEach(function(b){b.onclick=function(){var on=b.getAttribute('aria-pressed')!=='true';fDesign.setAttribute('aria-pressed','false');fReview.setAttribute('aria-pressed','false');b.setAttribute('aria-pressed',on?'true':'false');renderTable()}});

function buildWeekFilter(){
  var ws={};POSTS.forEach(function(p){ws[weekOf(p.d)]=1});
  var cur=weekOf(iso(TODAY)),keep=fWeek.value;
  fWeek.innerHTML='<option value="">كل الأسابيع</option><option value="now">هذا الأسبوع والقادم</option>'+Object.keys(ws).sort(function(a,b){return a-b}).map(function(w){return '<option value="'+w+'">الأسبوع '+w+' · '+weekRange(+w)+'</option>'}).join('');
  fWeek.value=keep||'';
}

/* ---------- render ---------- */
function render(){
  document.getElementById('v-sum').hidden=VIEW!=='sum';
  document.getElementById('v-tbl').hidden=VIEW!=='tbl';
  document.getElementById('v-set').hidden=VIEW!=='set';
  if(!POSTS.length&&!SETUP.length) return;
  if(VIEW==='sum') renderSum(); else if(VIEW==='set') renderSetup(); else renderTable();
}

function miniList(list,emptyTxt){
  if(!list.length) return '<p class="empty-note">'+emptyTxt+'</p>';
  return list.map(function(p){var d=pd(p.d);return '<button class="mini" data-id="'+esc(p.id)+'"><span class="md"><b>'+d.getDate()+' '+MON[d.getMonth()]+'</b>'+DAYS[d.getDay()]+'</span><span class="pl">'+esc(PSHORT[p.p]||p.p)+'</span><span class="mt">'+esc(p.t)+'</span>'+stTag(p.status)+'</button>'}).join('');
}

function renderSum(){
  var t=iso(TODAY),cw=weekOf(t);
  var thisW=POSTS.filter(function(p){return weekOf(p.d)===Math.max(cw,1)});
  var nextW=POSTS.filter(function(p){return weekOf(p.d)===Math.max(cw,1)+1});
  var pub=POSTS.filter(function(p){return p.status==='published'}).length;
  var ready=POSTS.filter(function(p){return DONE[p.status]}).length;
  var waiting=POSTS.filter(function(p){return p.status==='review'});
  var late=POSTS.concat(SETUP).filter(function(p){return isLate(p)||pubLate(p)}).sort(function(a,b){return a.d<b.d?-1:1});
  var ph=PHASES.filter(function(x){return t>=x.a&&t<=x.b})[0];
  var cnt={};ST.forEach(function(s){cnt[s.k]=0});POSTS.forEach(function(p){cnt[p.status]=(cnt[p.status]||0)+1});
  var bar=ST.map(function(s){return cnt[s.k]?'<i style="width:'+(cnt[s.k]/POSTS.length*100)+'%;background:var(--st-'+s.k+')" title="'+s.l+'"></i>':''}).join('');
  var leg=ST.map(function(s){return '<span><i class="dot" style="background:var(--st-'+s.k+')"></i>'+s.l+' <b class="num">'+cnt[s.k]+'</b></span>'}).join('');
  var phTxt=ph?('المرحلة الحالية: '+ph.n+' ('+fmtD(ph.a)+' – '+fmtD(ph.b)+')'):(t<'2026-10-15'?'الانطلاق: الخميس 15 أكتوبر 2026':'انتهت خطة الـ90 يوماً');
  var plc={IG:0,FB:0,TT:0,X:0};POSTS.forEach(function(p){targets(p).forEach(function(k){if(k in plc)plc[k]++})});
  var h='';
  h+='<div class="sum-grid">'+
    '<div class="stat"><b class="num">'+POSTS.length+'</b><span>منشور في خطة الـ90 يوماً</span></div>'+
    '<div class="stat"><b class="num">'+ready+'</b><span>جاهز (معتمد أو مجدول أو منشور)</span></div>'+
    '<div class="stat"><b class="num">'+pub+'</b><span>تم نشره</span></div>'+
    '<div class="stat"><b class="num">'+waiting.length+'</b><span>بانتظار الاعتماد</span></div>'+
    (SETUP.length?'<div class="stat"><b class="num">'+SETUP.filter(function(p){return DONE[p.status]}).length+' / '+SETUP.length+'</b><span>التأسيس قبل الانطلاق جاهز</span></div>':'')+
    '<div class="stat'+(late.length?' alert':'')+'"><b class="num">'+late.length+'</b><span>متأخر عن موعده</span></div>'+
  '</div>';
  h+='<div class="panel"><h2>سير الإنتاج</h2><p class="sub">'+esc(phTxt)+' · Instagram '+plc.IG+' · Facebook '+plc.FB+' · TikTok '+plc.TT+' · X '+plc.X+'</p>'+(PAUSED_N?'<p class="sub" style="margin-top:-4px">LinkedIn متوقف مؤقتاً لحد ما مشكلة الحساب تتحل، و'+PAUSED_N+' عناصر تأسيس خاصة بيه مخفية من اللوحة.</p>':'')+'<div class="pipe">'+bar+'</div><div class="legend">'+leg+'</div><div style="height:12px"></div></div>';
  h+='<div class="two">'+
    '<div class="panel"><h2>هذا الأسبوع</h2><p class="sub">الأسبوع '+Math.max(cw,1)+' · '+weekRange(Math.max(cw,1))+'</p>'+miniList(thisW,'لا يوجد نشر هذا الأسبوع.')+'</div>'+
    '<div class="panel"><h2>الأسبوع القادم</h2><p class="sub">الأسبوع '+(Math.max(cw,1)+1)+' · '+weekRange(Math.max(cw,1)+1)+'</p>'+miniList(nextW,'لا يوجد نشر مخطط للأسبوع القادم.')+'</div>'+
  '</div>';
  h+='<div class="two">'+
    '<div class="panel"><h2>بانتظار الاعتماد</h2><p class="sub">تصاميم جاهزة تحتاج موافقة قبل الجدولة</p>'+miniList(waiting.slice(0,8),'لا شيء بانتظار الاعتماد.')+'</div>'+
    '<div class="panel"><h2>متأخر</h2><p class="sub">فات موعد تسليم التصميم ('+DESIGN_LEAD+' أيام قبل النشر) أو موعد النشر</p>'+miniList(late.slice(0,8),'كل شيء في موعده.')+'</div>'+
  '</div>';
  var el=document.getElementById('v-sum');el.innerHTML=h;
  el.querySelectorAll('[data-id]').forEach(function(b){b.onclick=function(){openSheet(b.dataset.id)}});
}


function renderSetup(){
  var el=document.getElementById('set');
  var done=SETUP.filter(function(p){return DONE[p.status]}).length;
  document.getElementById('set-count').textContent=done+' من '+SETUP.length+' جاهز';
  if(!SETUP.length){el.innerHTML='<div class="state"><h3>لا توجد عناصر تأسيسية بعد</h3><p>أضف البايو والهايلايتس وصور الحسابات من زر «+ عنصر تأسيسي».</p></div>';return}
  var groups={},order=[];
  SETUP.forEach(function(p){var g=p.s||'أخرى';if(!groups[g]){groups[g]=[];order.push(g)}groups[g].push(p)});
  var head='<div class="thead srow"><span>آخر موعد</span><span>المنصة</span><span>العنصر</span><span>الحالة</span><span>الملفات</span></div>';
  el.innerHTML=order.map(function(g){
    var list=groups[g],dn=list.filter(function(p){return DONE[p.status]}).length;
    return '<section class="week"><div class="week-h"><h3>'+esc(g)+'</h3><span class="num">'+dn+' من '+list.length+' جاهز</span></div><div style="overflow-x:auto">'+head+list.map(function(p){
      var d=pd(p.d),late=isLate(p),files='';
      var th=firstThumb(p),nd=(p.designs||[]).length;
      if(th)files+='<img src="'+esc(th)+'" alt="" loading="lazy">'+(nd>1?'<span class="more num">+'+(nd-1)+'</span>':(!nd&&(p.im||[]).length>1?'<span class="more num">+'+((p.im||[]).length-1)+'</span>':''))+(nd?'<span class="notes">مرفوع</span>':'');
      else if(safeUrl(p.designLink))files+='<span class="more">رابط</span>';
      if(p.noteCount)files+='<span class="notes num">ملاحظات '+p.noteCount+'</span>';
      return '<button class="row srow" data-id="'+esc(p.id)+'"><span class="c-date"><b class="'+(late?'late-t':'')+'">'+d.getDate()+' '+MON[d.getMonth()]+'</b><span>'+DAYS[d.getDay()]+(late?' · متأخر':'')+'</span></span><span class="c-pl"><span class="pl">'+esc(PSHORT[p.p]||p.p)+'</span></span><span class="c-main"><span class="ttl">'+esc(p.t)+'</span>'+(p.f?'<span class="fmt">'+esc(p.f)+'</span>':'')+(hasPH(p)?'<span class="flags"><span class="flag warn">يحتاج بيانات [ ]</span></span>':'')+'</span><span class="c-st">'+stTag(p.status)+'</span><span class="c-files">'+files+'</span></button>';
    }).join('')+'</div></section>';
  }).join('');
  el.querySelectorAll('[data-id]').forEach(function(b){b.onclick=function(){openSheet(b.dataset.id)}});
}

function filtered(){
  var w=fWeek.value,pl=fPl.value,st=fSt.value,q=fQ.value.trim(),cw=Math.max(weekOf(iso(TODAY)),1);
  var dz=fDesign.getAttribute('aria-pressed')==='true',rv=fReview.getAttribute('aria-pressed')==='true';
  return POSTS.filter(function(p){
    var wk=weekOf(p.d);
    if(w==='now'&&(wk<cw||wk>cw+1))return false;
    if(w&&w!=='now'&&wk!==+w)return false;
    if(pl&&p.p!==pl&&targets(p).indexOf(pl)<0)return false;
    if(st&&p.status!==st)return false;
    if(dz&&!(p.status==='design'||p.status==='changes'||p.status==='copy'))return false;
    if(rv&&p.status!=='review')return false;
    if(q&&(p.t+' '+p.s+' '+p.c+' '+p.b+' '+p.f).indexOf(q)<0)return false;
    return true;
  });
}

function renderTable(){
  var list=filtered(),el=document.getElementById('tbl'),t=iso(TODAY);
  document.getElementById('count').textContent=list.length+' من '+POSTS.length;
  if(!list.length){el.innerHTML='<div class="state"><h3>لا توجد منشورات بهذه الفلاتر</h3><p>غيّر الأسبوع أو الحالة.</p></div>';return}
  var groups={},order=[];
  list.forEach(function(p){var w=weekOf(p.d);if(!groups[w]){groups[w]=[];order.push(w)}groups[w].push(p)});
  var head='<div class="thead"><span>النشر</span><span>المنصة</span><span>المستوى</span><span>المحتوى</span><span>الحالة</span><span>تسليم التصميم</span><span>الملفات</span></div>';
  el.innerHTML=order.map(function(w){
    var g=groups[w],ph=PHASES.filter(function(x){return g[0].d>=x.a&&g[0].d<=x.b})[0];
    return '<section class="week"><div class="week-h"><h3>الأسبوع '+w+'</h3><span>'+weekRange(w)+(ph?' · مرحلة '+ph.n:'')+' · '+g.length+' منشورات</span></div><div style="overflow-x:auto">'+head+
    g.map(function(p){
      var d=pd(p.d),late=isLate(p),flags='';
      if(hasPH(p))flags+='<span class="flag warn">يحتاج بيانات [ ]</span>';
      if(p.r)flags+='<span class="flag">إعادة توزيع</span>';
      if(!p.c)flags+='<span class="flag">النص بالبريف</span>';
      var files='';
      var th=firstThumb(p),nd=(p.designs||[]).length;
      if(th)files+='<img src="'+esc(th)+'" alt="" loading="lazy">'+(nd>1?'<span class="more num">+'+(nd-1)+'</span>':(!nd&&(p.im||[]).length>1?'<span class="more num">+'+((p.im||[]).length-1)+'</span>':''))+(nd?'<span class="notes">مرفوع</span>':'');
      else if(safeUrl(p.designLink))files+='<span class="more">رابط</span>';
      if(p.noteCount)files+='<span class="notes num">ملاحظات '+p.noteCount+'</span>';
      return '<button class="row'+(p.d<t&&p.status==='published'?' past':'')+'" data-id="'+esc(p.id)+'">'+
        '<span class="c-date"><b>'+d.getDate()+' '+MON[d.getMonth()]+'</b><span>'+DAYS[d.getDay()]+' · '+tmOf(p)+'</span></span>'+
        '<span class="c-pl"><span class="pl">'+esc(p.p)+'</span></span>'+
        '<span class="c-lv"><span class="lv '+esc(p.lv)+'">'+(p.lv==='P'?'إثبات':esc(p.lv))+'</span></span>'+
        '<span class="c-plv"><span class="pl">'+esc(p.p)+'</span><span class="lv '+esc(p.lv)+'">'+(p.lv==='P'?'إثبات':esc(p.lv))+'</span></span>'+
        '<span class="c-main"><span class="ser">'+esc(p.s)+'</span><span class="ttl">'+esc(p.t)+'</span><span class="fmt">'+esc(p.f)+'</span>'+(flags?'<span class="flags">'+flags+'</span>':'')+'</span>'+
        '<span class="c-st">'+stTag(p.status)+'</span>'+
        '<span class="c-due num'+(late?' late':'')+'">'+(DONE[p.status]?'—':fmtD(dueOf(p))+(late?' · متأخر':''))+'</span>'+
        '<span class="c-files">'+files+'</span>'+
      '</button>';
    }).join('')+'</div></section>';
  }).join('');
  el.querySelectorAll('[data-id]').forEach(function(b){b.onclick=function(){openSheet(b.dataset.id)}});
}

/* ---------- sheet ---------- */
var sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim');
function closeSheet(){EDITING=false;sheet.hidden=true;scrim.hidden=true;OPEN=null;NOTES=[];if(unNotes){unNotes();unNotes=null}}
scrim.onclick=closeSheet;
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!sheet.hidden)closeSheet()});

function openSheet(id){
  if(!BY[id])return;
  EDITING=false;OPEN=id;NOTES=[];sheet.hidden=false;scrim.hidden=false;renderSheet();
  if(unNotes){unNotes();unNotes=null}
  if(db){
    try{
      unNotes=db.collection('posts/'+id+'/notes').orderBy('at','asc').onSnapshot(function(s){NOTES=s.docs.map(function(d){var x=d.data();x._id=d.id;return x});renderNotes()},function(){});
    }catch(e){}
  }
}

function capHTML(c){return esc(c).replace(/\[([^\]]+)\]/g,'<mark>[$1]</mark>')}

function renderSheet(){
  var p=BY[OPEN];if(!p)return closeSheet();
  var d=pd(p.d),can=!readOnly&&ME.canWrite!==false;
  var src=p.r&&BY[p.r]?BY[p.r]:null;
  var h='<div class="sh-head"><div style="min-width:0;flex:1"><div class="meta"><span class="pl">'+esc(PSHORT[p.p]||p.p)+' <small>'+esc(PL[p.p]||'')+'</small></span>'+(isSetup(p)?'<span class="lv">تأسيس · '+esc(p.s)+'</span><span>آخر موعد: '+DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+'</span>':'<span class="lv '+esc(p.lv)+'">'+esc(p.lv==='P'?'إثبات الأداء':p.lv+' · '+LV[p.lv])+'</span><span>'+DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+' · '+tmOf(p)+'</span>')+'</div><h2 id="sh-title">'+esc(p.t)+'</h2>'+(canEditPost()?'<div class="row-btns"><button class="btn pri" id="ed-post">'+(isSetup(p)?'تعديل العنصر بالكامل':'تعديل المنشور بالكامل')+'</button></div>':'')+'</div><button class="x" id="sh-x" aria-label="إغلاق">×</button></div>';
  h+='<div class="sh-body">';
  // status
  h+='<div class="blk"><h4>الحالة</h4><div class="stepper" id="stepper">'+ST.map(function(s){return '<button data-k="'+s.k+'" style="--sc:var(--st-'+s.k+')" aria-pressed="'+(p.status===s.k?'true':'false')+'"'+(can&&canSt(p.status,s.k)?'':' disabled')+'>'+s.l+'</button>'}).join('')+'</div>'+
    '<p class="updated" id="upd" style="margin-top:6px"></p></div>';
  // dates
  if(isSetup(p)) h+='<div class="blk"><dl class="kv"><dt>آخر موعد</dt><dd class="num">'+fmtD(p.d)+'</dd><dt>القسم</dt><dd>'+esc(p.s)+'</dd>'+(p.f?'<dt>المواصفات</dt><dd>'+esc(p.f)+'</dd>':'')+'</dl></div>';
  else h+='<div class="blk"><dl class="kv"><dt>النشر</dt><dd class="num">'+fmtD(p.d)+' · '+tmOf(p)+'</dd><dt>تسليم التصميم</dt><dd class="num">'+(C('posts.edit')?'<input type="date" id="in-dd" value="'+esc(dueOf(p))+'" max="'+esc(p.d)+'"> ':fmtD(dueOf(p))+' ')+(p.dd?'<span class="updated">موعد مخصص</span>'+(C('posts.edit')?' <button class="btn" id="rs-dd" style="padding:2px 10px">رجوع للتلقائي</button>':''):'<span class="updated">('+DESIGN_LEAD+' أيام قبل النشر، والجمعة إجازة)</span>')+'</dd><dt>السلسلة</dt><dd>'+esc(p.s)+'</dd><dt>الشكل</dt><dd>'+esc(p.f)+'</dd>'+(p.cta?'<dt>الدعوة</dt><dd>'+esc(p.cta)+'</dd>':'')+'</dl></div>';
  // images
  if(p.im&&p.im.length) h+='<div class="blk"><h4>التصميم المقترح ('+p.im.length+')</h4><div class="imgs">'+p.im.map(function(s){return '<a href="'+esc(s)+'" target="_blank" rel="noopener"><img src="'+esc(s)+'" alt="تصميم مقترح" loading="lazy"></a>'}).join('')+'</div></div>';
  // uploaded designs
  var ds=p.designs||[];
  h+='<div class="blk"><h4>التصاميم المرفوعة'+(ds.length?' ('+ds.length+')':'')+'</h4>'+(ds.length?'<div class="imgs ups">'+ds.map(function(x,i){return dThumb(x,i,C('designs.delete'))}).join('')+'</div>':'<p class="updated">'+(C('designs.upload')?'ارفع التصميم هنا وهيظهر لوحده في صفحات المحتوى، والمنشور يتحول «للمراجعة».':'لم يُرفع تصميم بعد.')+'</p>')+
    (C('designs.upload')&&window.capital?'<div class="row-btns" style="margin-top:8px"><label class="btn pri up-btn"><input type="file" id="in-up" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/quicktime,application/pdf" multiple hidden>رفع تصميم</label><span class="updated" id="up-m"></span></div>':'')+'</div>';
  // design link
  var dl=safeUrl(p.designLink),pl=safeUrl(p.pubLink);
  h+='<div class="blk"><h4>رابط ملف المصدر (اختياري)</h4>'+(C('designs.upload')?'<div class="field"><input id="in-dl" type="url" dir="ltr" placeholder="رابط Drive أو Canva أو Figma" value="'+esc(p.designLink)+'"><button class="btn" id="sv-dl">حفظ</button></div>':'')+(dl?'<p style="margin-top:6px"><a class="link-out" href="'+esc(dl)+'" target="_blank" rel="noopener">'+esc(dl)+'</a></p>':(C('designs.upload')?'':'<p class="updated">لم يُرفع بعد.</p>'))+'</div>';

  else h+='<p class="updated">لا يوجد نص مكتوب بعد؛ يُكتب من البريف.</p>';
  h+='<div class="row-btns">'+(p.c?'<button class="btn" id="cp-cap">نسخ النص</button>':'')+'</div><div id="cap-ed"></div></div>';

function renderUpd(p){
  var el=document.getElementById('upd');if(!el)return;
  if(!p.updatedBy||!p.updatedAt){el.textContent='';return}
  var at=new Date(p.updatedAt);
  var txt=function(n){el.textContent='آخر تحديث: '+(n||'أحد الفريق')+' · '+at.toLocaleDateString('ar-SA-u-ca-gregory',{day:'numeric',month:'long'})+' '+at.toLocaleTimeString('ar-SA',{hour:'numeric',minute:'2-digit'})};
  txt('');
  if(user&&user.profiles)user.profiles([p.updatedBy]).then(function(ps){if(OPEN===p.id&&ps[p.updatedBy])txt(ps[p.updatedBy].name)}).catch(function(){});
}

function renderNotes(){
  var el=document.getElementById('thread');if(!el)return;
  if(!NOTES.length){el.innerHTML='<p class="updated">لا توجد ملاحظات بعد.</p>';return}
  var ids=[];NOTES.forEach(function(n){if(n.by&&ids.indexOf(n.by)<0)ids.push(n.by)});
  var draw=function(ps){
    el.innerHTML='';
    NOTES.forEach(function(n){
      var pr=ps[n.by]||{},row=document.createElement('div');row.className='note'+(n.sys?' sys':'');
      var img=document.createElement('img');img.alt='';img.src=pr.avatarUrl||'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
      var nb=document.createElement('div');nb.className='nb';
      var nh=document.createElement('div');nh.className='nh';var b=document.createElement('b');b.textContent=pr.name||'عضو في الفريق';var tm=document.createElement('span');
      var at=new Date(n.at);tm.textContent=isNaN(at)?'':at.toLocaleDateString('ar-SA-u-ca-gregory',{day:'numeric',month:'short'})+' '+at.toLocaleTimeString('ar-SA',{hour:'numeric',minute:'2-digit'});
      nh.appendChild(b);nh.appendChild(tm);
      var nt=document.createElement('div');nt.className='nt';nt.textContent=n.text;
      nb.appendChild(nh);nb.appendChild(nt);row.appendChild(img);row.appendChild(nb);el.appendChild(row);
    });
  };
  draw({});
  if(user&&user.profiles&&ids.length)user.profiles(ids).then(function(ps){if(document.getElementById('thread')===el)draw(ps)}).catch(function(){});
}

/* ---------- writes ---------- */
var busy={};
function stamp(){return {updatedBy:ME.id||'',updatedAt:new Date().toISOString()}}
function fail(e){
  if(e&&e.code==='invalid_argument'){readOnly=true;toast('ليس لديك صلاحية التعديل على هذه اللوحة. تقدر تشوف بس.');if(OPEN)renderSheet();return}
  if(e&&e.code==='quota_exceeded'){toast('مساحة اللوحة ممتلئة. احذف ملاحظات قديمة وحاول مجدداً.');return}
  toast('ما تم الحفظ. تأكد من الاتصال وحاول مرة ثانية.');
}
function write(id,patch,msg,note){
  if(!db)return toast('اللوحة غير متصلة الآن.');
  if(busy[id])return toast('لحظة، جارِ حفظ التعديل السابق.');
  busy[id]=true;
  var data=Object.assign({},patch,stamp());
  db.doc('posts/'+id).update(data).then(function(){
    busy[id]=false;toast(msg);
    if(note)return db.collection('posts/'+id+'/notes').add({by:ME.id||'',at:new Date().toISOString(),text:note,sys:true});
  }).catch(function(e){busy[id]=false;fail(e)});
}
function isImg(x){return /^image\//.test(x.type||'')}
function isVid(x){return /^video\//.test(x.type||'')}
function dThumb(x,i,can){
  var u=safeUrl(x.url);if(!u)return '';
  var media=isImg(x)?'<img src="'+esc(u)+'" alt="'+esc(x.name||'تصميم')+'" loading="lazy">':isVid(x)?'<video src="'+esc(u)+'#t=0.1" preload="metadata" muted playsinline></video>':'<span class="pdf">PDF</span>';
  var who=x.by?(NAMES[x.by]||x.by.split('@')[0]):'';
  return '<figure class="up"><a href="'+esc(u)+'" target="_blank" rel="noopener">'+media+'</a><figcaption><span>'+esc(who)+(x.at?' · '+fmtD(x.at.slice(0,10)):'')+'</span>'+(can?'<button class="rm" data-rm="'+i+'" title="حذف التصميم" aria-label="حذف التصميم">×</button>':'')+'</figcaption></figure>';
}
var NAMES={};
function uploadDesigns(id,files){
  files=[].slice.call(files||[]);if(!files.length)return;
  var m=document.getElementById('up-m'),done=[],n=0;
  function say(t){var e=document.getElementById('up-m');if(e)e.textContent=t}
  say('جارِ رفع '+files.length+' ملف…');
  files.reduce(function(pr,f){return pr.then(function(){return capital.upload(id,f).then(function(x){done.push(x);n++;say('اترفع '+n+' من '+files.length+'…')})})},Promise.resolve())
  .then(function(){
    var p=BY[id],patch={designs:(p.designs||[]).concat(done)};
    var toReview=['idea','copy','design','changes'].indexOf(p.status)>=0;
    if(toReview)patch.status='review';
    write(id,patch,toReview?'اترفع التصميم والمنشور الآن للمراجعة':'اترفع التصميم','رفع '+(done.length===1?'تصميم':done.length+' تصاميم')+(toReview?' وحوّل المنشور للمراجعة':''));
    say('');
  }).catch(function(e){say('');toast((e&&e.message)||'ما اترفعش الملف، حاول تاني.');
    if(done.length){var p=BY[id];write(id,{designs:(p.designs||[]).concat(done)},'اترفع جزء من الملفات','رفع '+done.length+' تصميم')}});
}
function removeDesign(id,i){

  ds.splice(i,1);
  write(id,{designs:ds},'اتحذف التصميم','حذف تصميم: '+(x.name||''));

function firstThumb(p){

function saveEdit(id,old){
  var g=function(k){return document.getElementById(k).value};
  var err=document.getElementById('e-err');err.hidden=true;
  var d=g('e-d'),t=g('e-t').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){err.textContent='اختار تاريخ النشر.';err.hidden=false;return}
  if(isFri(d)){err.textContent='يوم الجمعة إجازة، اختار يوم تاني.';err.hidden=false;return}
  if(!t){err.textContent='اكتب عنوان أو فكرة المنشور.';err.hidden=false;return}
  var ims=g('e-im').split('\n').map(function(x){return x.trim()}).filter(Boolean);
  var bad=ims.filter(function(x){return !(safeUrl(x)||/^img\/[\w.-]+$/.test(x))});
  if(bad.length){err.textContent='الرابط ده مش صحيح: '+bad[0]+' (لازم يبدأ بـ https://)';err.hidden=false;return}
  var data={kind:g('e-kind'),d:d,tm:g('e-tm').trim(),p:g('e-p'),lv:g('e-lv'),s:g('e-s').trim(),t:t,f:g('e-f').trim(),c:g('e-c'),b:g('e-b'),n:g('e-n'),cta:g('e-cta').trim(),r:g('e-r'),im:ims,status:g('e-st')};
  Object.assign(data,stamp());
  var btn=document.getElementById('e-save');btn.disabled=true;
  if(!id){
    var nid=d+'-'+data.p+'-'+Math.random().toString(36).slice(2,6);
    Object.assign(data,{designLink:'',pubLink:'',noteCount:0,lastNote:''});
    db.doc('posts/'+nid).set(data).then(function(){toast('اتضاف المنشور للتقويم');EDITING=false;OPEN=nid;openSheet(nid)}).catch(function(e){btn.disabled=false;fail(e)});
    return;
  }
  var changed=[],LBL={kind:'النوع',d:'التاريخ',tm:'الوقت',p:'المنصة',lv:'المستوى',s:'السلسلة',t:'العنوان',f:'الشكل',c:'النص',b:'البريف',n:'المطلوب تجهيزه',cta:'الدعوة',r:'إعادة التوزيع',im:'الصور',status:'الحالة'};
  Object.keys(LBL).forEach(function(k){var a=old[k]==null?(k==='kind'?'post':''):old[k],b=data[k];if(JSON.stringify(a)!==JSON.stringify(b))changed.push(LBL[k])});
  if(!changed.length){toast('لا يوجد تغيير.');btn.disabled=false;return}
  db.doc('posts/'+id).update(data).then(function(){
    toast('اتحفظت التعديلات');EDITING=false;openSheet(id);
    return db.collection('posts/'+id+'/notes').add({by:ME.id||'',at:new Date().toISOString(),text:'عدّل: '+changed.join('، '),sys:true});
  }).catch(function(e){btn.disabled=false;fail(e)});
}

/* ---------- boot ---------- */
function showState(h,p){var l=document.getElementById('loading');l.hidden=false;l.innerHTML='<h3>'+h+'</h3><p>'+p+'</p>'}
function boot(){
  if(!window.claude||!claude.use){showState('تعذّر تشغيل اللوحة','حدّث الصفحة.');return}
  claude.use('user').then(function(u){
    user=u;if(!u)return;
    return u.me().then(function(m){
      if(window.capital)NAMES=capital.names();ME.id=m.id;ME.name=m.name;ME.isOwner=m.isOwner;ME.canEdit=m.canEdit;ME.avatar=m.avatarUrl;
      return u.can('data.write').then(function(c){ME.canWrite=c;if(c===false)readOnly=true});
    }).then(function(){
      var w=document.getElementById('who');
      var role=window.capital&&capital.roleLabel?capital.roleLabel():(ME.isOwner?'مدير المحتوى':(ME.canWrite===false?'اطلاع فقط':'فريق التنفيذ'));
      w.innerHTML='';var img=document.createElement('img');img.alt='';img.src=ME.avatar;var n=document.createElement('span');n.textContent=ME.name||'أنت';var r=document.createElement('span');r.className='role';r.textContent=role;
      w.appendChild(img);w.appendChild(n);w.appendChild(r);
      document.getElementById('new-post').hidden=!C('posts.create');document.getElementById('new-setup').hidden=!C('posts.create');document.getElementById('new-setup').onclick=function(){renderEdit(null,'setup')};document.getElementById('new-post').onclick=function(){renderEdit(null)};if(OPEN&&!EDITING)renderSheet();
    });
  }).catch(function(){});
  claude.use('db').then(function(d){
    db=d;
    if(!d){showState('تعذّر فتح بيانات اللوحة','سجّل الدخول وافتح الرابط مرة ثانية.');return}
    d.collection('posts').orderBy('d','asc').limit(1000).onSnapshot(function(s){
      var ALL=s.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:((PO[a.p]||9)-(PO[b.p]||9))});
      BY={};ALL.forEach(function(p){BY[p.id]=p});
      PAUSED_N=ALL.filter(function(p){return PAUSED[p.p]}).length;ALL=ALL.filter(function(p){return !PAUSED[p.p]});
      POSTS=ALL.filter(function(p){return !isSetup(p)});SETUP=ALL.filter(isSetup);
      if(!ALL.length){showState('التقويم فاضي','المنشورات بتُضاف هنا أول ما تتجهز خطة النشر.');return}
      document.getElementById('loading').hidden=true;
      buildWeekFilter();render();
      var dm=/^#p=(.+)$/.exec(location.hash);if(dm&&BY[decodeURIComponent(dm[1])]){history.replaceState(null,'',location.pathname);openSheet(decodeURIComponent(dm[1]))}
      if(OPEN&&!EDITING){var aid=document.activeElement&&document.activeElement.id;var keep={};['in-note','in-dl','in-pl'].forEach(function(k){var e=document.getElementById(k);if(e)keep[k]=e.value});var ce=document.getElementById('in-cap'),ck=ce?ce.value:null;var sc=sheet.querySelector('.sh-body'),top=sc?sc.scrollTop:0;renderSheet();Object.keys(keep).forEach(function(k){var e=document.getElementById(k);if(e)e.value=keep[k]});if(ck!==null){editCap(BY[OPEN]);document.getElementById('in-cap').value=ck}var sc2=sheet.querySelector('.sh-body');if(sc2)sc2.scrollTop=top;if(aid){var fe=document.getElementById(aid);if(fe)fe.focus()}}
    },function(e){showState('انقطع الاتصال باللوحة','حدّث الصفحة لإعادة الاتصال.')});
  });
}
setView(['tbl','set'].indexOf(VIEW)>=0?VIEW:'sum');
boot();
})();
</script>
