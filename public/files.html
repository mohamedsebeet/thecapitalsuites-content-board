<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ملفات المشروع · ذا كابيتال سويتس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
:root{--bg:#F3F2EE;--surface:#FFFFFF;--soft:#ECEAE3;--ink:#1F2427;--ink-2:#4B5560;--ink-3:#77808A;--line:#D9D8D1;--gold:#C29B3C;--gold-ink:#8C6A1E;--char:#1F2427;--char-ink:#F7F4EC}
@media (prefers-color-scheme:dark){:root{--bg:#10161C;--surface:#172029;--soft:#1E2933;--ink:#ECE9E1;--ink-2:#B5BCC3;--ink-3:#86909A;--line:#2A3540;--gold-ink:#D4AE67;--char:#0B1015}}
*{box-sizing:border-box}
html,body{direction:rtl;height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;font-size:15px;line-height:1.6;display:flex;flex-direction:column}
a{color:inherit}
.top{background:var(--char);color:var(--char-ink);display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.3}
.brand small{color:#E2C466;font-size:12px;font-weight:600;letter-spacing:.02em}
.brand b{font-family:'Alexandria',Tahoma,sans-serif;font-size:20px}
.top .sp{flex:1}
.top a.btn,#who{font-size:13.5px}
a.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:1px solid rgba(247,244,236,.35);border-radius:999px;padding:6px 14px;color:var(--char-ink)}
a.btn:hover{border-color:#E2C466;color:#E2C466}
#who{display:flex;align-items:center;gap:8px}
#who img{width:26px;height:26px;border-radius:50%}
#who .role{font-size:12px;color:#E2C466;border:1px solid rgba(226,196,102,.5);border-radius:999px;padding:1px 9px}
.app{flex:1;display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0}
nav.side{background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;padding:16px 12px 40px}
.grp{font-size:12px;font-weight:600;color:var(--gold-ink);margin:18px 10px 6px;letter-spacing:.02em}
.grp:first-child{margin-top:4px}
nav.side a{display:block;text-decoration:none;padding:8px 10px;border-radius:8px;border:1px solid transparent}
nav.side a b{display:block;font-weight:600;font-size:14.5px}
nav.side a span{display:block;font-size:12px;color:var(--ink-3)}
nav.side a:hover{background:var(--soft)}
nav.side a[aria-current="page"]{background:var(--soft);border-color:var(--gold)}
nav.side a:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.bar h1{font-family:'Alexandria',Tahoma,sans-serif;font-size:17px;margin:0;flex:1;min-width:180px}
.bar .meta{font-size:12.5px;color:var(--ink-3)}
.bar a{font-size:13px;color:var(--gold-ink);font-weight:600;text-decoration:none}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
.home{padding:28px clamp(16px,3vw,40px) 60px;overflow-y:auto}
.home h2{font-family:'Alexandria',Tahoma,sans-serif;font-size:clamp(22px,3vw,30px);margin:0 0 6px}
.home p.lede{color:var(--ink-2);margin:0 0 22px;max-width:70ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:26px}
.card{display:flex;flex-direction:column;gap:4px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card:hover{border-color:var(--gold)}
.card .k{font-size:12px;color:var(--gold-ink);font-weight:600}
.card b{font-size:16px}
.card span{font-size:13.5px;color:var(--ink-2)}
.card i{font-style:normal;font-size:12px;color:var(--ink-3);margin-top:auto;padding-top:6px}
.home h3{font-size:14px;color:var(--ink-3);font-weight:600;margin:0 0 10px}
.pick{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.side{display:none}
  .pick{display:block;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .pick select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  .top{padding:10px 16px}
}
</style>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="runtime.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><small>THE CAPITAL SUITES · ذا كابيتال سويتس</small><b>ملفات المشروع</b></div>
  <div class="sp"></div>
  <a class="btn" href="./">← لوحة النشر</a>
  <div id="who"></div>
</header>
<div class="pick"><label for="pick" hidden>اختر ملفاً</label><select id="pick" aria-label="اختر ملفاً"></select></div>
<div class="app" id="app" hidden>
  <nav class="side" id="side" aria-label="ملفات المشروع"></nav>
  <main>
    <div class="bar" id="bar" hidden><h1 id="doc-t"></h1><span class="meta" id="doc-m"></span><a id="doc-o" href="#" target="_blank" rel="noopener">فتح في نافذة جديدة ↗</a></div>
    <iframe id="view" title="عرض الملف" hidden></iframe>
    <div class="home" id="home"></div>
  </main>
</div>
<script>
(function(){
  var GROUPS=[
    {g:'التشغيل اليومي',items:[
      {id:'board',t:'لوحة النشر',d:'تقويم المحتوى الحي: الحالات والتسليمات والملاحظات',m:'مباشر',href:'./',self:true}
    ]},
    {g:'الخطط',items:[
      {id:'shamel',t:'الملف الشامل',d:'خطة تسكين الوحدات: 8 أقسام من الخطة العامة إلى المحتوى والبراند',m:'آخر تحديث 6 أكتوبر',href:'files/shamel.html'},
      {id:'campaigns',t:'مخطط تنفيذ الحملات',d:'هيكل الحملات والمجموعات والإعلانات في سناب وميتا وتيك توك مع معاينة الجوال',m:'آخر تحديث 5 أكتوبر',href:'files/campaigns.html'},
      {id:'media',t:'الميديا بلان',d:'توزيع ميزانية الاختبار على المنصات والمراحل',m:'1 أكتوبر',href:'files/media-plan.html'},
      {id:'budget',t:'اعتماد ميزانية الحملات',d:'نموذج اعتماد الميزانية للإدارة',m:'5 أكتوبر',href:'files/budget.html'}
    ]},
    {g:'المحتوى',items:[
      {id:'cal30',t:'تقويم المحتوى · أول 30 يوماً',d:'صفحة الإدارة: المنشورات من 15 أكتوبر إلى 14 نوفمبر، والتجهيز من 11 أكتوبر',m:'آخر تحديث 8 أكتوبر',href:'files/cal30.html'},
      {id:'week1',t:'محتوى الأسبوع الأول',d:'تصاميم أول أسبوع نشر وملف النصوص والتعليمات',m:'7 أكتوبر',href:'files/week1.html'},
      {id:'where',t:'منشور «وين نشغّل»',d:'ثلاث اتجاهات لتصميم المنشور الثالث',m:'11 أكتوبر',href:'files/where.html'}
    ]},
    {g:'العروض للإدارة',items:[
      {id:'d-brand',t:'استراتيجية المحتوى والبراند',d:'عرض 10 شرائح',m:'6 أكتوبر',href:'files/decks/brand.html'},
      {id:'d-cal30',t:'تقويم أول 30 يوماً (عرض)',d:'نسخة مختصرة في 6 شرائح',m:'10 أكتوبر',href:'files/decks/cal30.html'},
      {id:'d-weekly',t:'تقرير الحملات الأسبوعي',d:'أسبوع 1 إلى 7 أكتوبر · 5 شرائح',m:'8 أكتوبر',href:'files/decks/weekly.html'}
    ]},
    {g:'الإعلانات',items:[
      {id:'ads',t:'إعلانات الحملة الحالية',d:'تصاميم الفيد والستوري والكاروسيل والفيديوهات للرمال والملز',m:'5 أكتوبر',href:'files/ads.html'}
    ]},
    {g:'الموقع',items:[
      {id:'site',t:'الموقع الجديد',d:'thecapitalsuites-new.vercel.app',m:'منشور',href:'https://thecapitalsuites-new.vercel.app',ext:true}
    ]}
  ];
  var BY={};GROUPS.forEach(function(g){g.items.forEach(function(i){BY[i.id]=i})});
  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
  var side=document.getElementById('side'),pick=document.getElementById('pick'),home=document.getElementById('home');
  var nav='',opts='<option value="">الصفحة الرئيسية للملفات</option>',cards='<h2>كل ملفات ذا كابيتال سويتس في مكان واحد</h2><p class="lede">آخر نسخة معتمدة من كل ملف. اختر من القائمة، أو افتح أي ملف في نافذة مستقلة.</p>';
  GROUPS.forEach(function(g){
    nav+='<div class="grp">'+esc(g.g)+'</div>';opts+='<optgroup label="'+esc(g.g)+'">';
    cards+='<h3>'+esc(g.g)+'</h3><div class="cards">';
    g.items.forEach(function(i){
      var href=i.self||i.ext?i.href:'#'+i.id, tgt=i.ext?' target="_blank" rel="noopener"':'';
      nav+='<a href="'+href+'"'+tgt+' data-id="'+i.id+'"><b>'+esc(i.t)+(i.ext?' ↗':'')+'</b><span>'+esc(i.m)+'</span></a>';
      opts+='<option value="'+i.id+'">'+esc(i.t)+'</option>';
      cards+='<a class="card" href="'+href+'"'+tgt+'><span class="k">'+esc(g.g)+'</span><b>'+esc(i.t)+(i.ext?' ↗':'')+'</b><span>'+esc(i.d)+'</span><i>'+esc(i.m)+'</i></a>';
    });
    opts+='</optgroup>';cards+='</div>';
  });
  side.innerHTML=nav;pick.innerHTML=opts;home.innerHTML=cards;
  pick.onchange=function(){var i=BY[pick.value];if(!i){location.hash='';return}if(i.self){location.href=i.href;return}if(i.ext){window.open(i.href,'_blank','noopener');pick.value='';return}location.hash=i.id};
  var view=document.getElementById('view'),bar=document.getElementById('bar');
  function route(){
    var id=location.hash.slice(1),i=BY[id];
    side.querySelectorAll('a').forEach(function(a){a.toggleAttribute('aria-current',a.getAttribute('data-id')===id);if(a.getAttribute('data-id')===id)a.setAttribute('aria-current','page')});
    if(!i||i.self||i.ext){view.hidden=true;bar.hidden=true;home.hidden=false;view.removeAttribute('src');pick.value='';document.title='ملفات المشروع · ذا كابيتال سويتس';return}
    home.hidden=true;bar.hidden=false;view.hidden=false;pick.value=id;
    document.getElementById('doc-t').textContent=i.t;document.getElementById('doc-m').textContent=i.m;
    document.getElementById('doc-o').href=i.href;
    if(view.getAttribute('src')!==i.href)view.setAttribute('src',i.href);
    document.title=i.t+' · ذا كابيتال سويتس';
  }
  addEventListener('hashchange',route);
  claude.use('user').then(function(u){return u.me()}).then(function(m){
    var w=document.getElementById('who');w.innerHTML='';var img=document.createElement('img');img.alt='';img.src=m.avatarUrl;var n=document.createElement('span');n.textContent=m.name;w.appendChild(img);w.appendChild(n);
    document.getElementById('app').hidden=false;route();
  });
})();
</script>
</body>
</html>
