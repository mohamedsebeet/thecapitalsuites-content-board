  function renderAdPreview(){
    if(AD.err)return '<h2>معاينة الإعلانات</h2><p class="note">تعذّر تحميل الإعلانات. حدّث الصفحة.</p>';
    if(!AD.ads||!AD.vLoaded)return '<p class="loading">جارِ تحميل الإعلانات…</p>';
    var all=adItems().filter(function(x){return !x.hidden&&(x.on||x.isNew||versOf(x.key).length)}),camps=adCamps(all);
    if(AP.camp&&camps.indexOf(AP.camp)<0)AP.camp='';
    var list=all.filter(function(x){return !AP.camp||x.camp===AP.camp});
    if(!list.length)return '<h2>معاينة الإعلانات</h2><p class="empty">مفيش إعلانات.</p>';
    var hm=/[?&]ad=([^&]+)/.exec(location.hash);if(hm&&!AP.key)AP.key=decodeURIComponent(hm[1]);
    var x=list.filter(function(z){return z.key===AP.key})[0]||list[0];AP.key=x.key;
    var vs=versOf(x.key);if(AP.ver!=='cur'&&!vs.some(function(v){return v.id===AP.ver}))AP.ver=vs.length&&!(x.img||[]).length?vs[0].id:'cur';
    if(!(x.img||[]).length&&AP.ver==='cur'&&vs.length)AP.ver=vs[0].id;
    if(!AP.pl)AP.pl=x.platform==='snap'?'sns':'igf';
    var h='<h2>معاينة الإعلانات</h2><p class="lede">شكل الإعلان وهو ممول على الموبايل قبل ما يتركّب. اختار الإعلان والنسخة والمكان، ودوس «قارن بالحالي» عشان تشوف النسخة الجديدة جنب الشغالة.</p>';
    h+='<div class="chips"><span class="chl">الحملة:</span><button data-apc="" aria-pressed="'+(AP.camp==='')+'">كل الحملات</button>'+camps.map(function(c){return '<button data-apc="'+esc(c)+'" aria-pressed="'+(AP.camp===c)+'">'+esc(c)+'</button>'}).join('')+'</div>';
    h+='<div class="pv"><div class="pv-list">';
    var byc={};list.forEach(function(z){(byc[z.camp||'بدون حملة']=byc[z.camp||'بدون حملة']||[]).push(z)});
    Object.keys(byc).forEach(function(c){h+='<div class="wkh">'+esc(c)+'</div>'+byc[c].map(function(z){var v=versOf(z.key)[0],src=(z.img||[])[0]||(v?(adFiles(v).filter(function(f){return /^image\//.test(f.type||'')})[0]||{}).url:'');
      return '<button class="pv-it" data-apk="'+esc(z.key)+'" aria-current="'+(z.key===x.key)+'">'+(src?'<img class="th" src="'+esc(src)+'" alt="" loading="lazy">':'<span class="th">—</span>')+'<span style="min-width:0"><b>'+esc(z.title)+'</b><span class="m">'+(z.platform==='meta'?'ميتا':z.platform==='snap'?'سناب':z.platform==='tiktok'?'تيك توك':'جديد')+(v?' · النسخة '+(v.data.v||'')+' '+(AST[v.data.status]||AST.review)[0]:'')+'</span></span></button>'}).join('')});
    h+='</div><div class="pv-main">';
    h+='<div class="pv-tabs">'+((x.img||[]).length?'<button data-apv="cur" aria-pressed="'+(AP.ver==='cur')+'">الحالي على المنصة</button>':'')+vs.map(function(v){return '<button data-apv="'+esc(v.id)+'" aria-pressed="'+(AP.ver===v.id)+'">النسخة '+(v.data.v||'')+'</button>'}).join('')+(vs.length&&(x.img||[]).length?'<button data-apcmp="1" aria-pressed="'+AP.cmp+'" class="cmpb">قارن بالحالي</button>':'')+'</div>';
    h+='<div class="pv-tabs">'+APL.map(function(p){return '<button data-app="'+p.k+'" aria-pressed="'+(AP.pl===p.k)+'">'+p.n+'</button>'}).join('')+'</div>';
    var cmp=AP.cmp&&AP.ver!=='cur'&&(x.img||[]).length;
    h+=cmp?'<div class="apcmp"><div><p class="apl">الحالي على المنصة</p>'+apPhone(x,'cur',AP.pl)+'</div><div><p class="apl">'+esc((vs.filter(function(v){return v.id===AP.ver})[0]||{data:{}}).data.v?'النسخة '+vs.filter(function(v){return v.id===AP.ver})[0].data.v:'النسخة الجديدة')+'</p>'+apPhone(x,AP.ver,AP.pl)+'</div></div>':apPhone(x,AP.ver,AP.pl);
    var cv=vs.filter(function(v){return v.id===AP.ver})[0];
    h+='<div class="pv-meta">'+esc(x.title)+(cv?' · النسخة '+(cv.data.v||'')+' · '+aTag(cv.data.status):'')+' · <a href="#ad-designs" data-apgo="'+esc(x.key)+'" style="color:var(--gold-ink)">افتح في تصاميم الإعلانات</a></div>';
    return h+'</div></div>';
  }
  function bindAdPreview(){
    page.querySelectorAll('[data-apc]').forEach(function(b){b.onclick=function(){AP.camp=b.dataset.apc;AP.key='';AP.i=0;rerender()}});
    page.querySelectorAll('[data-apk]').forEach(function(b){b.onclick=function(){AP.key=b.dataset.apk;AP.ver='cur';AP.i=0;AP.pl='';AP.cmp=false;AP.more=false;rerender()}});
    page.querySelectorAll('[data-apv]').forEach(function(b){b.onclick=function(){AP.ver=b.dataset.apv;AP.i=0;if(AP.ver==='cur')AP.cmp=false;rerender()}});
    page.querySelectorAll('[data-app]').forEach(function(b){b.onclick=function(){AP.pl=b.dataset.app;rerender()}});
    var c=page.querySelector('[data-apcmp]');if(c)c.onclick=function(){AP.cmp=!AP.cmp;if(AP.cmp&&AP.ver==='cur'){var vs=versOf(AP.key);if(vs[0])AP.ver=vs[0].id}rerender()};
    page.querySelectorAll('[data-api]').forEach(function(b){b.onclick=function(){AP.i+=+b.dataset.api;rerender()}});
    var mo=page.querySelector('[data-apmore]');if(mo)mo.onclick=function(){AP.more=true;rerender()};
    var g=page.querySelector('[data-apgo]');if(g)g.onclick=function(){AD.open=g.dataset.apgo;setTimeout(adSheet,50)};
  }

  /* ---------- الأرشيف ---------- */
  function renderLibrary(){
    var h='<h2>الأرشيف</h2><p class="lede">كل ملفات المشروع في مكان واحد، والملفات القديمة اللي اتشالت من القائمة في الآخر.</p>';
    GROUPS.forEach(function(g){
      var items=gItems(g).filter(function(i){return i.id!=='library'&&i.id!=='today'});if(!items.length)return;
      h+='<div class="sec"><h3>'+esc(g.g)+'</h3></div><div class="lib">'+items.map(function(i){
        var href=i.self||i.ext?i.href:'#'+i.id,tgt=i.ext?' target="_blank" rel="noopener"':'';
        return '<div class="card"><a href="'+href+'"'+tgt+' style="text-decoration:none;display:flex;flex-direction:column;gap:4px"><span class="k">'+esc(g.g)+'</span><b>'+esc(i.t)+(i.ext?' ↗':'')+'</b><span>'+esc(i.d)+'</span><i>'+esc(i.m)+'</i></a>'+(i.dl?'<span class="dlr">'+dlLinks(i).replace(/⬇ /g,'')+'</span>':'')+'</div>';
      }).join('')+'</div>';
    });
    return h;
  }

  /* ---------- التوجيه ---------- */
  var view=document.getElementById('view'),bar=document.getElementById('bar');
  function renderLive(id){
    var sc=page.scrollTop;
    page.innerHTML=id==='today'?renderToday():id==='content'?renderContent():id==='ads-live'?renderAds():id==='ads'?renderLiveAds():id==='publish'?renderPublish():id==='preview'?renderPreview():id==='ad-designs'?renderAdDesigns():id==='design-cal'?renderPostCal():id==='ad-preview'?renderAdPreview():renderLibrary();
    page.scrollTop=sc;
    if(id==='content')bindContent();if(id==='ads-live')bindAds();if(id==='ads')bindLiveAds();if(id==='publish')bindPublish();if(id==='preview')bindPreview();if(id==='ad-designs'){loadAdDesigns();bindAdDesigns()}if(id==='design-cal'){bindPostCal();if(PC.open)pcSheet()}if(id==='ad-preview'){loadAdDesigns();bindAdPreview()}
  }
  function route(){
    var id=location.hash.slice(1).split('?')[0];if(ALIAS[id]&&BY[ALIAS[id]]){var al=BY[ALIAS[id]];if(al.self){location.replace(al.href+(id==='design-cal'?'?view=month':''));return}history.replaceState(null,'','#'+ALIAS[id]);id=ALIAS[id]}if(!BY[id]||BY[id].self||BY[id].ext)id='today';
    var i=BY[id],changed=id!==CUR;CUR=id;
    side.querySelectorAll('a').forEach(function(a){if(a.getAttribute('data-id')===id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
    var cur=side.querySelector('a[aria-current]');if(cur&&cur.closest('details'))cur.closest('details').open=true;
    pick.value=id;document.title=i.t+' · ذا كابيتال سويتس';
    if(i.live){view.hidden=true;bar.hidden=true;page.hidden=false;view.removeAttribute('src');if(changed)page.scrollTop=0;renderLive(id);return}
    page.hidden=true;bar.hidden=false;view.hidden=false;
    document.getElementById('doc-t').textContent=i.t;document.getElementById('doc-m').textContent=i.m;document.getElementById('doc-o').href=i.href;document.getElementById('doc-dl').innerHTML=dlLinks(i);
    var src=i.href+(i.href.indexOf('?')<0?'?v='+V:'');if(view.getAttribute('src')!==src)view.setAttribute('src',src);
  }
  addEventListener('hashchange',route);
  claude.use('user').then(function(u){return u.me()}).then(function(m){
    var w=document.getElementById('who');w.innerHTML='';var img=document.createElement('img');img.alt='';img.src=m.avatarUrl;var n=document.createElement('span');n.textContent=m.name;w.appendChild(img);w.appendChild(n);
    var rl=document.createElement('span');rl.className='role';rl.textContent=capital.roleLabel?capital.roleLabel():'';rl.style.cssText='font-size:12px;color:var(--ink-3)';w.appendChild(rl);
    applyAccess();document.getElementById('app').hidden=false;load();route();
  });
})();
</script>
