<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
/* لوحة مبسطة: أسبوع واحد، أربع مراحل، وزرار واحد واضح لكل منشور حسب صلاحية الشخص */
:root{
  --bg:#F5F2EA;--surface:#FFFDF8;--sunk:#EDE8DC;--ink:#1F2427;--muted:#646A6E;--line:#E0D8C6;
  --gold:#C29B3C;--gold-ink:#8C6A1E;--gold-soft:#F3E8C9;--charcoal:#1F2427;--on:#F7F4EC;
  --work:#7A5BA6;--review:#B7791F;--ready:#2C8288;--done:#24603C;--warn:#B4483A;
  --fd:'Alexandria','IBM Plex Sans Arabic',Tahoma,sans-serif;--fb:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141719;--surface:#1D2124;--sunk:#252A2E;--ink:#EFEBE1;--muted:#A2A7AA;--line:#33393D;
  --gold:#E2C466;--gold-ink:#E2C466;--gold-soft:#3A3322;--charcoal:#0F1112;
  --work:#A98BD3;--review:#E0A64A;--ready:#5DBDC2;--done:#8FD3A6;--warn:#E07A6C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141719;--surface:#1D2124;--sunk:#252A2E;--ink:#EFEBE1;--muted:#A2A7AA;--line:#33393D;--gold:#E2C466;--gold-ink:#E2C466;--gold-soft:#3A3322;--charcoal:#0F1112;--work:#A98BD3;--review:#E0A64A;--ready:#5DBDC2;--done:#8FD3A6;--warn:#E07A6C;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{direction:rtl;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{background:var(--charcoal);color:var(--on);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-family:var(--fd);font-size:20px;margin:0;flex:1 1 auto}
.top h1 small{display:block;font-family:var(--fb);font-size:12px;font-weight:500;color:#C9B78A;letter-spacing:.02em}
.top a.lk{color:var(--on);font-size:13px;text-decoration:none;border:1px solid rgba(247,244,236,.3);border-radius:999px;padding:6px 12px;white-space:nowrap}
#who{display:flex;align-items:center;gap:8px;font-size:13.5px}#who img{width:26px;height:26px;border-radius:50%}#who .role{opacity:.7;font-size:12px}
#team-btn,#files-link{color:var(--on)!important;border-color:rgba(247,244,236,.3)!important}
.bar{max-width:1280px;margin:0 auto;padding:16px 20px 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wk{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.wk button{border:0;background:none;width:34px;height:34px;border-radius:50%;font-size:18px}.wk button:hover{background:var(--sunk)}
.wk b{font-family:var(--fd);font-size:14.5px;padding:0 8px;min-width:170px;text-align:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--charcoal);color:var(--on);border-color:var(--charcoal)}
.bar .sp{flex:1}
.hint{font-size:13px;color:var(--muted)}
.tabs{display:none}
.cols{max-width:1280px;margin:0 auto;padding:12px 20px 40px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.col{background:var(--sunk);border-radius:14px;padding:10px;min-height:120px}
.col h2{font-family:var(--fd);font-size:15px;margin:2px 4px 10px;display:flex;align-items:center;gap:8px}
.col h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.col h2 .n{margin-inline-start:auto;font-family:var(--fb);font-size:12.5px;color:var(--muted);font-weight:500}
.col .empty{font-size:13px;color:var(--muted);text-align:center;padding:18px 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.card .open{display:flex;gap:10px;width:100%;text-align:start;background:none;border:0;padding:10px}
.card .th{width:58px;height:58px;border-radius:8px;flex:none;background:var(--sunk) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.card .mt{min-width:0;flex:1}
.card .mt b{display:block;font-size:14px;line-height:1.45;font-weight:600}
.card .mt span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.card .mt .late{color:var(--warn);font-weight:600}
@media (hover:hover) and (pointer:fine){.card[draggable="true"]{cursor:grab}}
.card.drag{opacity:.4}
.cols.dragging .col{transition:outline-color .15s,background .15s;outline:2px dashed transparent;outline-offset:-2px}
.cols.dragging .col.can{outline-color:color-mix(in srgb,var(--c) 60%,transparent)}
.cols.dragging .col.can.over{background:color-mix(in srgb,var(--c) 14%,var(--sunk))}
.cols.dragging .col.no{opacity:.45}
.card .act{display:flex;gap:6px;padding:0 10px 10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-size:13.5px;font-weight:600;flex:1;text-align:center}
.btn.pri{background:var(--charcoal);color:var(--on);border-color:var(--charcoal)}
.btn.ok{background:var(--done);color:#fff;border-color:var(--done)}
.btn.no{color:var(--warn)}
.btn:disabled{opacity:.55;cursor:default}
label.btn{display:block;cursor:pointer}
/* التفاصيل */
#ov{position:fixed;inset:0;background:rgba(20,23,25,.45);z-index:50}
#sh{position:fixed;top:0;bottom:0;left:0;width:min(520px,100%);background:var(--surface);z-index:51;overflow:auto;box-shadow:0 18px 50px rgba(31,36,39,.25);padding:18px 20px 30px}
#sh .hd{display:flex;gap:10px;align-items:flex-start}
#sh h3{font-family:var(--fd);font-size:18px;margin:0;flex:1;line-height:1.4}
#sh .x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1}
#sh .meta{font-size:13px;color:var(--muted);margin:6px 0 12px}
#sh .st{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
#sh .sec{border-top:1px solid var(--line);padding:14px 0}
#sh .sec h4{margin:0 0 8px;font-size:13.5px;color:var(--gold-ink)}
#sh .cap{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;font-size:14.5px}
#sh .cap mark{background:var(--gold-soft);color:inherit;border-radius:3px}
#sh .imgs{display:flex;gap:8px;flex-wrap:wrap}
#sh .imgs a{display:block;width:112px;height:112px;border-radius:10px;overflow:hidden;background:var(--sunk)}
#sh .imgs img,#sh .imgs video{width:100%;height:100%;object-fit:cover}
#sh .imgs .pdf{display:flex;align-items:center;justify-content:center;height:100%;font-weight:700;color:var(--muted)}
#sh .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#sh .note{font-size:13.5px;border-bottom:1px dashed var(--line);padding:8px 0}
#sh .note small{display:block;color:var(--muted);font-size:12px}
#sh .note.sys{color:var(--muted)}
#sh textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);min-height:64px;resize:vertical}
#sh .full{font-size:13px;color:var(--gold-ink);text-decoration:none;font-weight:600}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--charcoal);color:var(--on);padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600}.seg button[aria-pressed="true"]{background:var(--charcoal);color:var(--on)}
.mcal{max-width:1280px;margin:12px auto 40px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.mhd,.mg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) 64px}
.mhd span{font-size:12.5px;font-weight:600;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);text-align:center}
.md{min-height:116px;border-inline-start:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.md:nth-child(7n+1){border-inline-start:0}.md.out{background:var(--bg)}.md.out .mn b{opacity:.45}.md.fri{background:var(--sunk)}
.md.now .mn b{background:var(--gold);color:#fff;border-radius:999px;padding:0 7px}.md.over{outline:2px dashed var(--gold);outline-offset:-3px;background:var(--gold-soft)}
.mn{display:flex;gap:6px;align-items:center;font-size:12.5px}.mn span{display:none}.mn i{font-style:normal;font-size:11px;color:var(--muted)}
.mc{display:flex;gap:6px;align-items:center;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--c);border-radius:8px;padding:3px;min-width:0}
.mc[draggable="true"]{cursor:grab}.mc.drag{opacity:.4}.mc:hover{border-color:var(--gold)}
.mc .th{width:30px;height:36px;border-radius:5px;flex:none;background:var(--sunk) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.mc .mt{min-width:0;display:flex;flex-direction:column}.mc .mt b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mc .mt small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sh .ver{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}#sh .ver .vh{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}#sh .ver .vh small{color:var(--muted);font-size:12px}
#sh input[type=date]{border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg);margin-inline-start:6px}
@media (max-width:900px){.mhd{display:none}.mg{display:block}.md{border-inline-start:0;min-height:0}.md.empty,.md.out{display:none}.mn b{display:none}.mn span{display:inline;font-weight:600}.mcal{margin:10px 16px 40px}}
#sh .anw{position:relative;display:block}#sh .anb{position:absolute;bottom:6px;inset-inline-start:6px;border:0;border-radius:999px;background:rgba(31,36,39,.88);color:#F7F4EC;font-size:12px;font-weight:600;padding:4px 10px;text-decoration:none}#sh .anb:hover{background:var(--gold);color:var(--charcoal)}
#sh .imgs a.anb{width:auto;height:auto;display:inline-block;overflow:visible;background:rgba(31,36,39,.88)}
#sh .mk{margin-top:8px;padding:8px;border:1px dashed var(--warn);border-radius:10px}#sh .mk b{display:block;font-size:12.5px;color:var(--warn);margin-bottom:6px}#sh .mkn{margin:6px 0 0;font-size:13px}
#loading{text-align:center;padding:60px 20px;color:var(--muted)}
@media (max-width:900px){
  .tabs{display:flex;gap:6px;overflow-x:auto;max-width:1280px;margin:0 auto;padding:6px 16px 0}
  .tabs button{flex:1 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:13.5px;white-space:nowrap}
  .tabs button[aria-pressed="true"]{background:var(--charcoal);color:var(--on);border-color:var(--charcoal)}
  .cols{grid-template-columns:1fr;padding:10px 16px 40px}
  .col{display:none;background:none;padding:0}.col.on{display:block}.col h2{display:none}
  .bar{padding:12px 16px 0}.wk b{min-width:0}.top{padding:12px 16px}
}
</style>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="runtime.js"></script>
<div class="top">
  <h1><small>THE CAPITAL SUITES · المحتوى</small>اللوحة المبسطة</h1>
  <a class="lk" href="./">اللوحة الكاملة</a>
  <div id="who"></div>
</div>
<div id="loading">جارِ التحميل…</div>
<main id="app" hidden>
  <div class="bar">
    <div class="seg" id="vw"><button data-v="week">الأسبوع</button><button data-v="month">الشهر</button></div>
    <div class="wk"><button id="pv" aria-label="اللي فات">›</button><b id="wkl"></b><button id="nx" aria-label="الجاي">‹</button></div>
    <button class="chip" id="today">الأسبوع ده</button>
    <button class="chip" id="mine" aria-pressed="false">اللي عليّا بس</button>
    <span class="sp"></span>
    <span class="hint" id="dnd" hidden>اسحب المنشور للخانة اللي عايزها ·</span><span class="hint" id="sum"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="cols" id="cols"></div>
  <div class="mcal" id="mcal" hidden></div>
</main>
<div id="ov" hidden></div>
<aside id="sh" hidden role="dialog" aria-modal="true"></aside>
<div id="toast" hidden></div>
<script>
(function(){
'use strict';
var STAGES=[
  {k:'work',t:'محتاج شغل',c:'var(--work)',st:['idea','copy','design','changes'],e:'مفيش منشورات محتاجة شغل.'},
  {k:'review',t:'للمراجعة',c:'var(--review)',st:['review'],e:'مفيش حاجة مستنية مراجعة.'},
  {k:'ready',t:'جاهز للنشر',c:'var(--ready)',st:['approved','scheduled'],e:'مفيش منشورات معتمدة مستنية نشر.'},
  {k:'done',t:'اتنشر',c:'var(--done)',st:['published'],e:'لسه ما اتنشرش حاجة الأسبوع ده.'}];
var STL={idea:'فكرة',copy:'النص جاهز',design:'عند المصمم',changes:'تعديلات مطلوبة',review:'للمراجعة',approved:'معتمد',scheduled:'مجدول',published:'منشور'};
var STAGE_OF={};STAGES.forEach(function(s){s.st.forEach(function(x){STAGE_OF[x]=s})});
var PLN={IG:'إنستغرام',FB:'فيسبوك',TT:'تيك توك',X:'X',LI:'لينكدإن (متوقف)',ALL:'كل المنصات',WA:'واتساب'};
var PAUSED={LI:1}; // لينكدإن متوقف مؤقتاً
var TIME={IG:'9:00 م',FB:'9:00 م',TT:'9:00 م',X:'8:00 م'};
var DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var MON=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var LEAD=3;
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function workday(d){while(d.getDay()===5)d=addD(d,-1);return d}
function dueOf(p){return p.dd||iso(workday(addD(pd(p.d),-LEAD)))}
function fmt(s){var d=pd(s);return DAYS[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]}
function fmtS(s){var d=pd(s);return d.getDate()+' '+MON[d.getMonth()]}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:''}
function targets(p){return (p.targets||({IG:['IG'],FB:['FB'],TT:['TT'],X:['X'],ALL:['IG','FB','TT','X']}[p.p]||[])).filter(function(k){return !PAUSED[k]})}
function isImg(x){return /^image\//.test(x.type||'')}
function thumb(p){var d=(p.designs||[]).filter(isImg)[0];if(d&&safeUrl(d.url))return d.url;var i=(p.im||[])[0];return i?(safeUrl(i)||(/^img\/[\w.-]+$/.test(i)?i:'')):''}
function C(k){return window.capital&&capital.can?capital.can(k):false}
var TODAY=new Date();TODAY.setHours(0,0,0,0);var T=iso(TODAY);
// الأسبوع من السبت للخميس
function weekStart(d){var x=new Date(d);x.setHours(0,0,0,0);var back=(x.getDay()+1)%7;return addD(x,-back)}
var WS=weekStart(TODAY),db=null,POSTS=[],BY={},ME='',NAMES={},MINE=false,TAB='work',OPEN=null,unN=null;
var VIEW='week',MS=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
try{MINE=localStorage.getItem('simple-mine')==='1';TAB=localStorage.getItem('simple-tab')||'work';VIEW=localStorage.getItem('simple-view')||'week'}catch(e){}
if(/[?&]view=month\b/.test(location.search))VIEW='month';
function canMove(){return C('posts.edit')||C('publish.schedule')}

var toastT;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2600)}
function fail(e){toast(e&&(e.code==='invalid_argument'||/permission|security/i.test(e.message||''))?'مالكش صلاحية على الخطوة دي.':'ما اتحفظش، حاول تاني.')}
function write(id,patch,msg,note){
  patch.updatedBy=ME;patch.updatedAt=new Date().toISOString();
  return db.doc('posts/'+id).update(patch).then(function(){toast(msg);
    if(note)return db.collection('posts/'+id+'/notes').add({by:ME,at:new Date().toISOString(),text:note,sys:true}).catch(function(){})}).catch(fail);
}

/* ---------- الإجراء الأساسي لكل منشور ---------- */
function canPublishAll(p){if(!C('publish.mark'))return false;var pl=capital.platforms();var tg=targets(p);return tg.length&&tg.some(function(k){return !pl||pl.indexOf(k)>=0})}
function actions(p,big){
  var s=STAGE_OF[p.status]||STAGES[0],h='';
  if(s.k==='work'&&C('designs.upload'))h+='<label class="btn pri">'+((p.designs||[]).length?'ارفع نسخة جديدة':'ارفع التصميم')+'<input type="file" data-up="'+esc(p.id)+'" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/quicktime,application/pdf" multiple hidden></label>';
  if(s.k==='work'&&(p.designs||[]).length&&(C('posts.status')||C('posts.approve'))&&!h)h+='<button class="btn pri" data-go="review" data-id="'+esc(p.id)+'">ابعته للمراجعة</button>';
  if(s.k==='review'&&C('posts.approve'))h+='<button class="btn ok" data-go="approved" data-id="'+esc(p.id)+'">اعتماد ✓</button><button class="btn no" data-go="changes" data-id="'+esc(p.id)+'">تعديلات</button>';
  if(s.k==='ready'&&canPublishAll(p))h+='<button class="btn ok" data-pub="'+esc(p.id)+'">اتنشر ✓</button>';
  if(s.k==='done'&&big&&C('posts.approve'))h+='<button class="btn" data-go="scheduled" data-id="'+esc(p.id)+'">رجّعه «جاهز للنشر»</button>';
  return h;
}
function isMine(p){
  var s=(STAGE_OF[p.status]||STAGES[0]).k;
  return (s==='work'&&(C('designs.upload')||C('posts.edit')))||(s==='review'&&C('posts.approve'))||(s==='ready'&&canPublishAll(p));
}
function lateOf(p){var s=(STAGE_OF[p.status]||STAGES[0]).k;if(s==='work'&&dueOf(p)<T)return 'التسليم كان '+fmtS(dueOf(p));if(s!=='done'&&p.d<T)return 'ميعاد النشر عدّى';return ''}

/* ---------- العرض ---------- */
function inWeek(p){var a=iso(WS),b=iso(addD(WS,6));return p.d>=a&&p.d<=b}
function render(){
  document.querySelectorAll('#vw button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===VIEW?'true':'false')});
  var mon=VIEW==='month';document.getElementById('cols').hidden=mon;document.getElementById('tabs').hidden=mon;document.getElementById('mcal').hidden=!mon;
  if(mon){renderMonth();return}
  var a=WS,b=addD(WS,5),cur=iso(WS)===iso(weekStart(TODAY));
  document.getElementById('today').textContent='الأسبوع ده';
  document.getElementById('wkl').textContent=(cur?'الأسبوع ده · ':'')+a.getDate()+' '+MON[a.getMonth()]+' – '+b.getDate()+' '+MON[b.getMonth()];
  document.getElementById('today').hidden=cur;document.getElementById('dnd').hidden=!FINE;
  var mb=document.getElementById('mine');mb.setAttribute('aria-pressed',MINE?'true':'false');
  // المنشورات المتأخرة من أسابيع فاتت بتظهر في الأسبوع الحالي
